  return a[a.length - 1][0];
}
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x, lerp = (a, b, u) => a + (b - a) * u;
const E = { io: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2, out: u => 1 - Math.pow(1 - u, 3), in: u => u * u * u, o5: u => 1 - Math.pow(1 - u, 5) };

function step(tau, f = 2.6, z = .7) { if (tau <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + z * w / wd * Math.sin(wd * tau)); }
const sp = (t, t0, f = 2.4, z = .75) => step(t - t0, f, z);
const pop = (t, t0, f = 3, z = .55) => clamp(sp(t, t0, f, z), 0, 1.25);

    if (c.nodeType === 3) { const frag = document.createDocumentFragment(); c.textContent.split(/(\s+)/).forEach((w) => {
      if (!w) return; if (/^\s+$/.test(w)) { frag.appendChild(document.createTextNode(w)); return; }
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w; frag.appendChild(s); }); c.replaceWith(frag); }
    else if (c.nodeType === 1) walk(c); }); };
  walk(root); return root;
}
// A masked headline line. Font shrinks at init if the line would leave the 70 px side margins.
function line(html, y, size, weight = 700, color = '#fafafa', parent = hud) {
