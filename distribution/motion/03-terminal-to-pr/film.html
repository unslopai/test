const T = STR[LANG];

// ---------------------------------------------------------------- engine (same primitives as films 01/02)
const LIME = '#bef264', RED = '#f87171', AMBER = '#fcd34d';
const BEAT = 60 / 130, BAR = 4 * BEAT;

// ---------------------------------------------------------------- scenes
