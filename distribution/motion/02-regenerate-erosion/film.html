function step(tau, f = 2.6, z = .7) { if (tau <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + z * w / wd * Math.sin(wd * tau)); }

const pop = (t, t0, f = 3, z = .55) => clamp(sp(t, t0, f, z), 0, 1.25);

const vis = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };
function wordify(root) {
  const walk = (node) => { [...node.childNodes].forEach((c) => {
    if (c.nodeType === 3) { const frag = document.createDocumentFragment(); c.textContent.split(/(\s+)/).forEach((w) => {
      if (!w) return; if (/^\s+$/.test(w)) { frag.appendChild(document.createTextNode(w)); return; }
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w; frag.appendChild(s); }); c.replaceWith(frag); }
    else if (c.nodeType === 1) walk(c); }); };
  walk(root); return root;
}

  wordify(el.firstElementChild); el.dataset.size = size; return el;

}

  </div>
  <div class="btn cb" id="cbtn" style="left:40px;top:680px;height:70px;padding:0 32px;background:${LIME};color:#0a0a0b;font:600 31px Geist;letter-spacing:-.01em"><span id="cbl"></span></div>
</div>`, 13);

// ---------------------------------------------------------------- end card (pixel shield = packages/vscode-extension/icon.png, 16 x 16 grid)
const SHIELD = ['...##########...', '...##########...', '...#######..#...', '...######..##...', '...#..##..###...', '...##....####...', '...###..#####...', '....########....', '.....######.....', '......####......', '.......##.......'];
const CELL = 26, SX = 540 - 8 * CELL, SY = 420, END = 13 * BAR;       // end card on bar 14 = 24.375 s
const cells = [];
SHIELD.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '#') cells.push([x, y, mk(hud, `<div class="a" style="width:${CELL + .6}px;height:${CELL + .6}px;background:${LIME}"></div>`, 30)]); }));
const word = mk(hud, `<div class="a" style="font:700 132px Silkscreen;color:#fafafa;letter-spacing:0;white-space:nowrap;line-height:1">unslop</div>`, 30);
const caret = mk(hud, `<div class="a" style="width:52px;height:100px;background:${LIME}"></div>`, 30);
const tag = line(T.tag, 1010, 66, 700), sub1 = line(`<span style="color:#d4d4d8">${T.sub1}</span>`, 1118, 44, 500), sub2 = line(`<span style="color:#a1a1aa">${T.sub2}</span>`, 1180, 42, 400);
const url = line(`<span style="font-family:Silkscreen;font-weight:400;letter-spacing:0;color:#d4d4d8">${T.url}</span>`, 1330, 46, 400);

// ---------------------------------------------------------------- camera keys [t, zoom, focusX, focusY, screenX, screenY]
const FOC = [470, CY + CT + 2.5 * LH];
const CAM = [[0, 1, 540, 960, 540, 960], [1.85, 1, 540, 960, 540, 960], [2.6, 1.12, FOC[0], FOC[1], 490, 860], [5.62, 1.15, FOC[0], FOC[1], 490, 860], [5.625, 1, 540, 960, 540, 960], [99, 1, 540, 960, 540, 960]];
function camAt(t) {
  let k = 0; while (k < CAM.length - 2 && t >= CAM[k + 1][0]) k++;
  const a = CAM[k], b = CAM[k + 1], u = b[0] - a[0] < .01 ? 1 : E.io(clamp((t - a[0]) / (b[0] - a[0])));

  return [z, lerp(a[2], b[2], u), lerp(a[3], b[3], u), lerp(a[4], b[4], u), lerp(a[5], b[5], u)];
}
function beatPunch(t) {
  let p = 0;
  for (let k = 0; DROP + k * BEAT < END - .1; k++) { const bt = DROP + k * BEAT; if (t >= bt) p += (k % 4 === 0 ? .022 : .008) * Math.exp(-(t - bt) * 8) * Math.sin(Math.min(Math.PI, (t - bt) * 24)); }
  return p;
}

// ---------------------------------------------------------------- seek (film time; every value derived from t)
function sceneLoop(t) {
  const cIn = clamp(sp(t, -0.4, 2.2, .8), 0, 1.02);
  box(codeCard, CX, CY + (1 - cIn) * 90); codeCard.style.transform = `scale(${lerp(.95, 1, clamp(cIn))})`; codeCard.style.opacity = clamp(cIn * 1.6); vis(codeCard, t < BRK);
  const r = CLICKS.filter(c => t >= c).length, ci = CHANGED[r], since = r ? t - CLICKS[r - 1] : 99, scr = since < .2;
  codeLines.forEach((l, i) => { const src = l.querySelector('.src');
    if (i === ci && scr) { src.textContent = scramble(ROUNDS[r][i], t, i); src.style.color = r === 3 ? '#fca5a5' : '#d9f99d'; }
    else { src.innerHTML = ROUNDS[r][i]; src.style.color = ''; }
    l.style.opacity = clamp((t + .45 - i * .04) / .2); });
  $('rchip').textContent = r ? `${T.regen}${r}` : T.orig;
  $('rchip').style.transform = `scale(${r ? pop(t, CLICKS[r - 1], 3.6, .5) : 1})`;
  // rewritten line: lime flash for the harmless rewrites, red and underlined for the injection
  const danger = r === 3;
  box(chg, 0, CT + Math.max(ci, 0) * LH); chg.style.visibility = r > 0 ? 'inherit' : 'hidden';
  chg.style.background = danger ? `rgba(239,68,68,${.14 * P(since, 0, .2)})` : `rgba(190,242,100,${.16 * (1 - P(since, .2, .5))})`;
  chg.style.borderLeft = danger ? `6px solid ${RED}` : 'none';
  const sqp = $('sq'); sqp.setAttribute('d', squiggle(78 + 4 * CH, 78 + 42 * CH, CT + 2 * LH + 46)); drawOn(sqp, P(t, CLICKS[2] + .3, .45, E.out)); sq.style.visibility = danger ? 'inherit' : 'hidden';
  // the regenerate button: pressed on every click, leaves after the third
  let press = 0; CLICKS.forEach(c => { if (t >= c - .05 && t < c + .08) press = .06; });
  const bOut = P(t, 1.72, .3, E.in), bIn = clamp(sp(t, -0.3, 2.4, .7), 0, 1.03);
  box(regenBtn, BTN[0], BTN[1] + (1 - bIn) * 60 + bOut * 40); regenBtn.style.transform = `scale(${lerp(.9, 1, clamp(bIn)) * (1 - press) * (1 - bOut * .08)})`;
  regenBtn.style.opacity = clamp(bIn * 1.5) * (1 - bOut); vis(regenBtn, t < 2.05);
  const cur = $('cur');
  if (t < 2.05) { let dip = 0; CLICKS.forEach(c => { if (t >= c - .05 && t < c + .08) dip = .14; });
    const u = P(t, -0.2, .55, E.out), x = lerp(1000, BTN[0] + BTN[2] * .62, u), y = lerp(1500, BTN[1] + BTN[3] * .6, u);
    vis(cur, true); cur.style.opacity = 1 - bOut; cur.style.transform = `translate(${x - 5}px,${y - 4}px) scale(${1 - dip})`; }
  rise(TT.hA, t, -0.22, 1.72); rise(TT.hB1, t, 1.9, 3.55); rise(TT.hB2, t, 2.05, 3.55); rise(TT.hC, t, 3.72, 5.3, 2.4);
}
// small camera shake on every regenerate (added to the world transform)
function shake(t) { let x = 0, y = 0; CLICKS.forEach((c, i) => { if (t >= c) { const d = Math.exp(-(t - c) * 14); x += d * 9 * Math.sin((t - c) * 70 + i); y += d * 5 * Math.cos((t - c) * 60 + i); } }); return [x, y]; }
function sceneChart(t) {
  const on = t >= BRK && t < 10.35, out = P(t, 9.95, .35, E.in);
  rise(TT.sH, t, BRK + .02, 9.95);
  BARS.forEach((v, i) => { const t0 = 5.95 + i * .47, u = clamp(sp(t, t0, 1.8, .82), 0, 1.02), h = v * SCALE * u * (1 - out);
    box(bars[i], BX[i], BASE - h, null, h); vis(bars[i], on && t >= t0);
    const vu = P(t, t0 + .05, .6, E.out); vals[i].textContent = (v * vu).toFixed(1); box(vals[i], BX[i], BASE - h - 96); vals[i].style.opacity = vu * (1 - out); vis(vals[i], on && t >= t0); });
  box(baseLine, 120, BASE); baseLine.style.transform = `scaleX(${P(t, BRK + .1, .5, E.out) * (1 - out)})`; vis(baseLine, on);
  rise(axis, t, 6.2, 9.95); rise(cap, t, 7.6, 9.95); rise(srcLn, t, 7.85, 9.95);
}
function sceneChecks(t, ft) {
  rise(TT.hD, t, 10.35, 12.95);
  rise(TT.hE1, t, DROP + .05, 15.5); rise(TT.hE2, t, DROP + .2, 15.5);
  rise(TT.hG, t, 21.62, END - .3, 2.4);
  // list: in 10.4, fades out in place for the comment (15.55), back at 20.3, out before the end card
  const lIn = clamp(sp(t, 10.4, 2.2, .8), 0, 1.02), lOut = P(t, 15.55, .3, E.in), lBack = P(t, 20.3, .35, E.out), lEnd = P(t, END - .35, .3, E.in);
  const shown = t < 15.9 ? 1 - lOut : lBack * (1 - lEnd);
  box(list, CX, lerp(760, LY, lIn), null, 84 + ROW * lerp(2, 3, clamp(sp(t, 20.45, 2.4, .85), 0, 1.01)) + 8); list.style.opacity = t < 15.9 ? clamp(lIn * 1.5) * (1 - lOut) : shown;
  list.style.transform = `scale(${lerp(.95, 1, clamp(lIn)) * (1 - (t < 15.9 ? lOut : 1 - lBack + lEnd) * .05)})`; vis(list, t >= 10.4 && t < END + .1 && shown > .001);
  const failing = t >= DROP && t < 20.3;
  list.style.borderColor = failing ? `rgba(248,113,113,${.1 + .4 * P(t, DROP, .2, E.out)})` : t >= 21.5625 ? `rgba(190,242,100,${.1 + .3 * P(t, 21.5625, .25, E.out)})` : 'rgba(255,255,255,.10)';
  rows.forEach((row, i) => { const [ta, tv, sv] = RS[i], st = t < tv ? 0 : sv, u = P(t, ta, .45, E.o5);
    row.style.opacity = u; row.style.transform = `translateY(${(1 - u) * 24}px)`; row.style.visibility = t >= ta ? 'inherit' : 'hidden';
    ['i0', 'i1', 'i2'].forEach((c, k) => { row.querySelector('.' + c).style.visibility = k === st ? 'inherit' : 'hidden'; });
    row.querySelector('.' + ['i0', 'i1', 'i2'][st]).style.transform = `scale(${st ? pop(t, tv, 3.6, .5) : 1})`;
    row.querySelector('.arc').setAttribute('transform', `rotate(${(ft * 400) % 360} 28 28)`);
    ['s0', 's1', 's2'].forEach((c, k) => { const el = row.querySelector('.' + c); el.style.visibility = k === st ? 'inherit' : 'hidden';
      el.style.transform = `translateY(${(1 - clamp(step(t - (k ? tv : ta), 3, .8), 0, 1.03)) * 100}%)`; });
    row.querySelector('.tint').style.opacity = st === 1 ? P(t, tv, .2, E.out) : 0; });
}
function sceneComment(t) {
  rise(TT.hF1, t, 15.9, 20.05); rise(TT.hF2, t, 17.65, 20.05);
  const mIn = clamp(sp(t, 15.85, 2.1, .8), 0, 1.02), mOut = P(t, 20.2, .18, E.in);
  box(cmt, CX, lerp(1400, 580, mIn) - mOut * 50); cmt.style.opacity = clamp(mIn * 1.5) * (1 - mOut);
  cmt.style.transform = `scale(${lerp(.95, 1, clamp(mIn)) * (1 - mOut * .05)})`; vis(cmt, t >= 15.85 && t < 20.4);
  cmt.style.height = px(lerp(420, 790, clamp(sp(t, 17.55, 2.2, .85), 0, 1.01)));
  cmt.querySelectorAll('.cb').forEach((el, i) => { const tin = i < 2 ? 16.05 + i * .14 : 17.7 + (i - 2) * .16, u = P(t, tin, .45, E.o5);
    el.style.opacity = u; el.style.transform = `translateY(${(1 - u) * 30}px)`; });
  const click = 43 * BEAT;                                           // 20.156 s, on the beat
  $('cbtn').style.transform = `scale(${t >= click && t < click + .12 ? .94 : 1})`;
  $('cbl').textContent = t >= click + .12 ? T.committed : T.commit;
  if (t < 2.05) return;
  const cur = $('cur'); cur.style.opacity = 1; let on = false, x = 0, y = 0, dip = 0;
  if (t >= 19.2 && t < 20.25) { const u = P(t, 19.2, .8, E.io); x = lerp(1120, CX + 40 + 250, u); y = lerp(1720, 580 + 680 + 46, u); on = true; if (t >= click && t < click + .12) dip = .14; }
  vis(cur, on); cur.style.transform = `translate(${x - 5}px,${y - 4}px) scale(${1 - dip})`;
}
function sceneEnd(t, ft) {
  cells.forEach(([x, y, el]) => { const u = pop(t, END + .03 + y * .035 + Math.abs(x - 7.5) * .012, 3.6, .6);
    box(el, SX + x * CELL, SY + y * CELL); el.style.transform = `scale(${u})`; vis(el, t >= END); });
  const wu = clamp(sp(t, END + .47, 2.4, .8), 0, 1.02), ww = word.offsetWidth, wx = 540 - (ww + 24 + 52) / 2;
  box(word, wx, 772 + (1 - wu) * 60); word.style.opacity = clamp(wu * 1.4); vis(word, t >= END + .47);
  box(caret, wx + ww + 24, 776 + (1 - wu) * 60); vis(caret, t >= END + .6 && Math.floor(ft / .55) % 2 === 0);
  rise(tag, t, END + .85); rise(sub1, t, END + 1.2); rise(sub2, t, END + 1.35); rise(url, t, END + 1.7);
}

let TL = null;
function warp(T) {                                                 // film time -> scene time (timeline.json anchors)
  const a = TL.anchors; if (T <= a[0][1]) return a[0][0];
  for (let k = 1; k < a.length; k++) if (T <= a[k][1]) { const [s0, f0] = a[k - 1], [s1, f1] = a[k]; return s0 + (s1 - s0) * (T - f0) / (f1 - f0); }
  return a[a.length - 1][0];
}
window.seek = async (filmT) => {
  const t = warp(filmT), ft = filmT;
  const [z, fx, fy, sx, sy] = camAt(t);
  cam.style.transform = `translate(${sx - fx * z}px,${sy - fy * z}px) scale(${z})`;
  const [shx, shy] = shake(t);
  $('world').style.transform = `translate(${shx}px,${shy}px) scale(${1 + beatPunch(t) + .035 * P(t, END + .6, 3.2, E.io)})`;
  $('wash').style.transform = `translateX(${Math.sin(ft * .3) * 50}px)`;
  sceneLoop(t); sceneChart(t); sceneChecks(t, ft); sceneComment(t); sceneEnd(t, ft);
  return true;
};

(async () => {
  await Promise.all(['400 40px Geist', '500 40px Geist', '600 40px Geist', '700 40px Geist', '700 40px Silkscreen', '400 40px Silkscreen', '400 30px GeistMono'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  TL = await (await fetch('timeline.json')).json();
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  hud.querySelectorAll('.m').forEach(el => fitLine(el));
  if (BETA) { $('betaTxt').textContent = T.beta; $('beta').style.visibility = 'visible'; }
  await window.seek(0); window.ready = true;
})();
</script></body></html>
