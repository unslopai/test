<!doctype html>
<html><head><meta charset="utf-8"><title>unslop PH real shots</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
/* PH gallery 1270x760, same frame as distribution/channels/05-producthunt/visuals/gallery.html.
   Every product surface in these frames is an unedited, cropped GitHub screenshot (logged out, dark scheme, 2x). */
.pg{position:absolute;inset:0;padding:34px 56px 0;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:18px}
.hdr .wm{font-size:24px}
.hdr .lbl{margin-left:auto;font:500 19px Geist;color:var(--faint)}
.foot{position:absolute;left:56px;right:56px;bottom:18px;font:500 15px Geist;color:var(--faint);letter-spacing:0;display:flex;justify-content:space-between}
.shot{display:block;border:2px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.9);background:#0d1117}
.shot img{display:block;width:100%}
.cap{font:600 15px Geist;color:var(--muted);letter-spacing:-.01em;margin:0 0 7px}
.t{font:700 44px Geist;letter-spacing:-.035em;color:#fafafa;margin:0;line-height:1.06}
.s{font:500 20px Geist;color:var(--muted);letter-spacing:-.01em;margin:14px 0 0;line-height:1.35}
</style></head><body>

<section class="frame" id="ph-01-pr-check-real" style="width:1270px;height:760px">
  <div class="dots"></div><div class="wash"></div>
  <div class="pg">
    <div class="hdr"><div class="wm">unslop<i></i></div><span class="lbl">Anti-Slop Gatekeeper</span></div>
    <div style="margin:10px auto 0;width:960px">
      <div class="cap">Checks</div>
      <div class="shot"><img src="raw/pr20-check-row.png"></div>
      <div class="cap" style="margin-top:12px">Files changed</div>
      <div class="shot"><img src="raw/pr20-files-comment.png"></div>
    </div>
  </div>
  <div class="foot"><span>Real screenshot, github.com/unslopai/test</span><span>pull/20 · cropped, unedited</span></div>
</section>

<section class="frame" id="ph-01b-pr-suggestion-real" style="width:1270px;height:760px">
  <div class="dots"></div><div class="wash"></div>
  <div class="pg">
    <div class="hdr"><div class="wm">unslop<i></i></div><span class="lbl">Anti-Slop Gatekeeper</span></div>
    <div style="display:flex;gap:44px;margin-top:30px;align-items:flex-start">
      <div style="width:370px;padding-top:40px">
        <h2 class="t" style="font-size:40px">💡 Suggested fix<br><span class="lime">(1-click commit)</span></h2>
        <p class="s" style="font-family:GeistMono;font-size:17px;letter-spacing:0">complex-calculator/<br>src/App.tsx</p>
      </div>
      <div class="shot" style="width:740px"><img src="raw/pr14-hal002-thread.png"></div>
    </div>
  </div>
  <div class="foot"><span>Real screenshot, github.com/unslopai/test</span><span>pull/14 · cropped, unedited</span></div>
</section>
</body></html>
