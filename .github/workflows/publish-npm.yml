# Veröffentlicht @unslopcodes/cli oder @unslopcodes/mcp auf npm — nur von Hand
# (Actions → Publish npm package → Run workflow). Ablauf am Launch-Tag:
# docs/release.md. Default ist der Dry-Run: Tarball als Artefakt, kein Publish.
name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Paket unter packages/
        type: choice
        options: [cli, mcp]
        required: true
      dry-run:
        description: Nur packen und prüfen, nichts veröffentlichen
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  pack:
    name: Build, Test, Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACKAGE_DIR: packages/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Kein npm-Cache im Release-Pfad: ein vergifteter Cache aus einem PR-Lauf
      # soll nie in einen veröffentlichten Tarball gelangen.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      # @unslop/shared wird per esbuild ins Paket gebündelt, seine Tests gehören
      # deshalb zum Paket dazu.
      - name: Tests (Paket + @unslop/shared)
        run: npx vitest run "$PACKAGE_DIR" packages/shared

      - name: Build
        run: npm run build --workspace "$PACKAGE_DIR"

      - name: npm pack
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"

      # Prüft genau den Tarball aus dem Artefakt gegen die Registry-Regeln,
      # ohne Token und ohne erneuten Build (Tarballs lösen kein prepack aus).
      - name: npm publish --dry-run
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --dry-run --access public

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-${{ inputs.package }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 14

  # Eigener Job ohne Checkout und ohne `npm ci`: Token und OIDC-Recht existieren
  # nur hier, und hier laufen keine Install-Skripte. Veröffentlicht wird genau
  # der Tarball, den `pack` gebaut und getestet hat. Das Environment `release`
  # hält `NPM_TOKEN` und lässt nur `main` zu (docs/release.md); die ref-Prüfung
  # verhindert zusätzlich einen versehentlichen Start von einem anderen Branch.
  publish:
    name: npm publish
    needs: pack
    if: ${{ !inputs.dry-run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # npm --provenance signiert über GitHub OIDC
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-${{ inputs.package }}
          path: ${{ runner.temp }}/pack

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: npm publish --provenance
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
