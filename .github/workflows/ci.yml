# Lint, Tests und Next-Build auf jedem PR und jedem Push nach main.
# Ersetzt die Handprüfung des Koordinators vor dem Merge (docs/release.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Auf PRs bricht ein neuer Push den alten Lauf ab. Auf main bekommt jeder
# Commit eine eigene Gruppe: eine gemeinsame Gruppe würde bei schnellen Merges
# den wartenden Lauf verwerfen, und der Commit hätte keinen CI-Beleg.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 = Runtime des Vercel-Projekts (nodeVersion 24.x) und aktives LTS.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Ohne Secrets skippen die Remote-Guards (Grant-Guard gegen Supabase),
      # 24 Tests — das ist erwartet.
      - run: npm test

      # src/lib/supabase.ts wirft beim Modul-Laden ohne URL und Service-Key, und
      # `next build` lädt die API-Routen beim „Collecting page data“. Die Werte
      # sind Platzhalter ohne Zugriff auf irgendetwas; der Build ruft Supabase
      # nicht auf. Echte Werte kommen nie in diesen Workflow.
      - name: npm run build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-secret
          NEXT_TELEMETRY_DISABLED: '1'
